server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    connection-timeout: 600000
    keep-alive-timeout: 600000

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/blueprint_ai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      max-lifetime: 1800000
      connection-timeout: 30000
      validation-timeout: 5000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

blueprintai:
  billing:
    demo-enabled: ${BILLING_DEMO_ENABLED:false}
    pro-price-paise: ${BILLING_PRO_PRICE_PAISE:49900}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      live-enabled: ${RAZORPAY_LIVE_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production-minimum-32-bytes}
    expiration-ms: 86400000  # 24 hours
  storage:
    base-path: ${STORAGE_BASE_PATH:./data/blueprint-ai}
  ai:
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    openai-api-key: ${OPENAI_API_KEY:}
    google-ai-api-key: ${GOOGLE_AI_API_KEY:${GEMINI_API_KEY:}}
    groq-api-key: ${GROQ_API_KEY:}
    deepseek-api-key: ${DEEPSEEK_API_KEY:}
    grok-api-key: ${GROK_API_KEY:}
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
  vercel:
    client-id: ${VERCEL_CLIENT_ID:}
    client-secret: ${VERCEL_CLIENT_SECRET:}
    integration-slug: ${VERCEL_INTEGRATION_SLUG:}
    redirect-uri: ${VERCEL_REDIRECT_URI:http://localhost:3000/auth/vercel/callback}
  security:
    token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
blueprintai:
  billing:
    demo-enabled: true

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
